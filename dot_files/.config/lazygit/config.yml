git:
  autoStageResolvedConflicts: false
  autoFetch: false
  #branchLogCmd: git log --graph --first-parent --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --
os:
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
gui:
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - '#6f806f'
    selectedRangeBgColor:
      - '#6f806f'

